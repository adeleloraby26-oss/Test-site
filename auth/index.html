<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AM PRO — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="auth.css"/>
</head>
<body>
<div class="bg-canvas">
  <div class="grid-lines"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div id="toast">
  <span class="toast-dot"></span>
  <span id="toastText"></span>
</div>

<div class="card">
  <div class="logo">
    <div class="logo-icon"><img src="../logo.png" alt="AM PRO Logo"></div>
    <span class="logo-text">AM PRO</span>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabLogin" onclick="switchTab('login')">Sign In</div>
    <div class="tab" id="tabSignup" onclick="switchTab('signup')">Create Account</div>
  </div>

  <!-- LOGIN -->
  <div id="loginBox" class="field-group">
    <div class="input-wrap">
      <span class="ic"><!-- mail --><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
      <input id="loginEmail" type="email" placeholder="Email address" autocomplete="email"/>
    </div>
    <div class="input-wrap">
      <span class="ic"><!-- lock --><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
      <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password"/>
      <button class="eye-btn" type="button" id="eyeLogin" onclick="toggleEye('loginPass','eyeLogin')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button class="btn-primary" id="loginBtn" onclick="login()">Sign In</button>
  </div>

  <!-- SIGNUP -->
  <div id="signupBox" class="field-group hidden">
    <div class="grid-2">
      <div class="input-wrap">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
        <input id="sigName" placeholder="Full name"/>
      </div>
      <div class="input-wrap">
        <span class="ic" style="font-size:15px;font-weight:700;color:var(--muted);font-family:monospace">@</span>
        <input id="sigUsername" placeholder="Username"/>
      </div>
    </div>
    <div class="grid-2">
      <div class="input-wrap">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="11" r="4"/><path d="M12 15v6M9 18h6M17 3l-5 5M17 3h-4M17 3v4M7 3l5 5M7 3h4M7 3v4"/></svg></span>
        <select id="sigGender">
          <option value="">Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>
      <div class="input-wrap">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span>
        <select id="sigField">
          <option value="">Field</option>
          <option>Programming</option>
          <option>Content Creation</option>
          <option>Sports</option>
          <option>Design</option>
          <option>Marketing</option>
        </select>
      </div>
    </div>
    <div class="input-wrap">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
      <input id="sigEmail" type="email" placeholder="Email address" autocomplete="email"/>
    </div>
    <div class="input-wrap">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
      <input id="sigPass" type="password" placeholder="Password" autocomplete="new-password" oninput="checkStrength(this.value)"/>
      <button class="eye-btn" type="button" id="eyeSig" onclick="toggleEye('sigPass','eyeSig')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="strength-wrap">
      <div class="sb" id="sb1"></div><div class="sb" id="sb2"></div>
      <div class="sb" id="sb3"></div><div class="sb" id="sb4"></div>
      <div class="sb" id="sb5"></div>
    </div>
    <div class="strength-lbl" id="strengthLbl">Password strength</div>
    <div class="input-wrap">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
      <input id="sigConfirm" type="password" placeholder="Confirm password" autocomplete="new-password"/>
      <button class="eye-btn" type="button" id="eyeConfirm" onclick="toggleEye('sigConfirm','eyeConfirm')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button class="btn-primary" id="signupBtn" onclick="signup()">Create Account</button>
  </div>
</div>

<script src="../config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
</body>
</html>
